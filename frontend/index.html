<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<script id="aclib" type="text/javascript" src="//acscdn.com/script/aclib.js"></script>
<script type="text/javascript">
  aclib.runAutoTag({
    zoneId: 'ioeaspmlbj',
  });
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Turismo IA</title>
<meta name="description" content="Dicas, roteiros e destinos de turismo gerados com IA.">
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --text: #1c2733;
    --muted: #64748b;
    --accent: #0e7490;
    --accent2: #6d28d9;
    --line: #e2e8f0;
    --radius: 16px;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --line: #334155;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
  }
  .hero {
    background: linear-gradient(135deg, #0e7490, #6d28d9 75%);
    color: #fff;
    padding: 48px 20px 56px;
    text-align: center;
  }
  .hero h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.6rem); letter-spacing: -.5px; }
  .hero p { margin: 8px 0 0; opacity: .9; font-size: 1.05rem; }
  main { max-width: 860px; margin: -28px auto 60px; padding: 0 16px; }
  .post {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 28px;
    transition: transform .2s ease, box-shadow .2s ease;
  }
  .post:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(15, 23, 42, .14); }
  .cover { width: 100%; height: 260px; object-fit: cover; display: block; background: var(--line); }
  .post-body { padding: 22px 24px 24px; }
  .tag { display: inline-block; background: rgba(14, 116, 144, .12); color: var(--accent);
         font-size: .78rem; font-weight: 600; letter-spacing: .4px;
         text-transform: uppercase; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
  .post h2 { margin: 0 0 6px; font-size: 1.5rem; letter-spacing: -.3px; line-height: 1.25; }
  .meta { color: var(--muted); font-size: .85em; margin-bottom: 14px; }
  .meta .tags { opacity: .85; }
  .post p.summary { color: #475569; margin: 0 0 16px; }
  @media (prefers-color-scheme: dark) { .post p.summary { color: #cbd5e1; } }
  .more {
    display: inline-block; cursor: pointer; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 0; border-radius: 999px; padding: 10px 22px; font-size: .92rem;
    transition: transform .15s ease, filter .15s ease;
  }
  .more:hover { filter: brightness(1.08); transform: scale(1.03); }
  .post .content { display: none; margin-top: 22px; padding-top: 20px; border-top: 1px dashed var(--line); }
  .post.open .content { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .content h1, .content h2, .content h3 { line-height: 1.3; margin: 1.6em 0 .5em; letter-spacing: -.3px; }
  .content h1 { font-size: 1.5rem; } .content h2 { font-size: 1.32rem; } .content h3 { font-size: 1.12rem; }
  .content p { margin: .75em 0; }
  .content .img { margin: 1.4em 0; }
  .content .img img {
    width: 100%; height: auto; border-radius: 12px;
    box-shadow: var(--shadow); display: block;
  }
  .content ul { padding-left: 1.3em; margin: .75em 0; }
  .content li { margin: .3em 0; }
  .content strong { color: var(--accent); }
  .content a { color: var(--accent); }
  #msg { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { text-align: center; color: var(--muted); font-size: .85em; padding: 0 16px 40px; }
</style>
</head>
<body>
<header class="hero">
  <h1>Blog Turismo IA</h1>
  <p>Destinos, roteiros e dicas de viagem.</p>
</header>
<main id="list"><p id="msg">Carregando…</p></main>
<footer>Conteúdo informativo gerado automaticamente todos os dias.</footer>

<script>
const API = new URLSearchParams(location.search).get("api") || "https://blog-turismo-api.onrender.com";

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function mdInline(s) {
  return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/\*(.+?)\*/g, "<em>$1</em>")
          .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(text) {
  const lines = esc(text).split("\n");
  const html = [];
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    const img = l.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if (img) { html.push('<div class="img"><img loading="lazy" src="' + img[2] + '" alt="' + img[1] + '" onerror="this.onerror=null;this.src=\'https://picsum.photos/seed/\'+encodeURIComponent(this.alt)+\'/1024/576\';"></div>'); i++; continue; }
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h) { html.push("<h" + h[1].length + ">" + mdInline(h[2]) + "</h" + h[1].length + ">"); i++; continue; }
    if (/^\s*[-*]\s+/.test(l)) {
      const items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push("<li>" + mdInline(lines[i].replace(/^\s*[-*]\s+/, "")) + "</li>");
        i++;
      }
      html.push("<ul>" + items.join("") + "</ul>");
      continue;
    }
    if (l.trim() === "") { i++; continue; }
    html.push("<p>" + mdInline(l) + "</p>");
    i++;
  }
  return html.join("\n");
}

async function load() {
  const list = document.getElementById("list");
  try {
    const res = await fetch(API + "/posts?status=published&limit=30");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const posts = await res.json();
    if (!posts.length) {
      list.innerHTML = "<p id=\"msg\">Ainda não há artigos publicados.</p>";
      return;
    }
    document.title = posts[0].meta_title || document.title;
    list.innerHTML = posts.map(p => `
      <article class="post" id="${esc(p.slug)}">
        ${p.cover_image ? '<img class="cover" loading="lazy" src="' + esc(p.cover_image) + '" alt="' + esc(p.title) + '" onerror="this.onerror=null;this.src=\'https://picsum.photos/seed/cover-\'+encodeURIComponent(this.alt)+\'/1024/576\';" >' : ""}
        <div class="post-body">
          <span class="tag">${esc((p.tags || []).slice(0, 1).join("")) || "Turismo"}</span>
          <h2>${esc(p.title)}</h2>
          <div class="meta">${p.category ? esc(p.category) + " · " : ""}<span class="tags">${esc((p.tags || []).map(t => "#" + t).join("  "))}</span></div>
          <p class="summary">${esc(p.summary)}</p>
          <button class="more">Ler mais</button>
          <div class="content">${md(p.content)}</div>
        </div>
      </article>`).join("");
    list.querySelectorAll(".post").forEach(card => {
      card.querySelector(".more").addEventListener("click", () => {
        card.classList.toggle("open");
        card.querySelector(".more").textContent = card.classList.contains("open") ? "Fechar" : "Ler mais";
      });
    });
  } catch (e) {
    document.getElementById("msg").textContent = "Erro ao carregar: " + e.message;
  }
}
load();
</script>
</body>
</html>
