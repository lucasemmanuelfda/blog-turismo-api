name: Gerar conteudo diario do blog

on:
  schedule:
    # Diariamente as 03h UTC (00h no horario de Brasilia)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar artigos do dia
        run: |
          curl -sS -X POST "${{ vars.API_URL }}/generate/daily?publish=true" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"