name: TMP backfill kit (remover apos o uso)

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar deploy do endpoint /kit no Render
        run: sleep 150

      - name: Gerar kit nos posts publicados sem kit
        run: |
          retry_curl() { curl -sS --retry 6 --retry-delay 15 --retry-all-errors "$@"; }
          ids=$(retry_curl "${{ vars.API_URL }}/posts?status=published&limit=50" | jq -r '.[] | select((.kit_recommendations // []) | length == 0) | .id')
          if [ -z "$ids" ]; then echo "Nenhum post sem kit."; exit 0; fi
          for id in $ids; do
            code=$(retry_curl -o /dev/null -w "%{http_code}" -X POST "${{ vars.API_URL }}/posts/$id/kit" -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" || true)
            echo "Post $id -> HTTP $code"
          done