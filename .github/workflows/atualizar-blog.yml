name: Atualizar blog (gera, publica e deploys)

on:
  schedule:
    # 03h UTC = meia-noite no horario de Brasilia
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      content:
        description: "Gerar e publicar conteudo (deploy so do worker nao gera posts)"
        type: boolean
        default: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar artigos do dia
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          curl -sS -X POST "${{ vars.API_URL }}/generate/daily?publish=true" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"

      - name: Publicar todos os posts agendados
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          # Render free dorme em inatividade e derruba a 1a conexao (curl 56) no cold start.
          retry_curl() { curl -sS --retry 6 --retry-delay 15 --retry-all-errors "$@"; }
          ids=$(retry_curl "${{ vars.API_URL }}/posts?status=scheduled&limit=50" | jq -r '.[].id')
          if [ -z "$ids" ]; then echo "Nenhum post agendado."; exit 0; fi
          for id in $ids; do
            code=$(retry_curl -o /dev/null -w "%{http_code}" -X POST "${{ vars.API_URL }}/posts/$id/publish" -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" || true)
            echo "Post $id -> HTTP $code"
          done

      - name: Notificar IndexNow (indexaÃ§Ã£o em minutos)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          host="blog-turismo-api.lucasemmanuel2005.workers.dev"
          key="${{ secrets.INDEXNOW_KEY }}"
          body=$(jq -nc --arg h "$host" --arg k "$key" '{host:$h,key:$k,keyLocation:("https://" + $h + "/" + $k + ".txt"),urlList:["https://" + $h + "/sitemap.xml"]}')
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" -d "$body" || true)
          echo "IndexNow -> HTTP $code"

      - name: Reapontar blogs para o tema correlacionado (cadeia)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          curl -sS -X POST "${{ vars.API_URL }}/posts/relink" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" \
            -w "\nHTTP %{http_code}\n"

      - uses: actions/checkout@v4

      - name: Autenticar no Google (Indexing API)
        id: google-auth
        continue-on-error: true
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/indexing'

      - name: Notificar Google Indexing (sÃ³ posts novos/atualizados nas Ãºltimas 24h)
        if: ${{ steps.google-auth.conclusion == 'success' }}
        run: |
          # A cota do Google Ã© 200 URLs/dia por propriedade; enviamos sÃ³ o que mudou.
          host="blog-turismo-api.lucasemmanuel2005.workers.dev"
          since=$(date -u -d "24 hours ago" +%Y-%m-%dT%H:%M:%S)
          slugs=$(curl -sS --retry 6 --retry-delay 15 --retry-all-errors \
            "${{ vars.API_URL }}/posts?status=published&limit=50" \
            | jq -r --arg s "$since" '.[] | select(.published_at >= $s) | .slug' || true)
          if [ -z "$slugs" ]; then echo "Nada novo nas Ãºltimas 24h."; exit 0; fi
          count=0
          for slug in $slugs; do
            code=$(curl -sS -o /tmp/google-index.json -w "%{http_code}" -X POST \
              "https://indexing.googleapis.com/v3/urlNotifications:publish" \
              -H "Authorization: Bearer ${{ steps.google-auth.outputs.access_token }}" \
              -H "Content-Type: application/json" \
              -d "{\"url\":\"https://$host/post/$slug/\",\"type\":\"URL_UPDATED\"}" || true)
            if [ "$code" = 429 ]; then
              cat /tmp/google-index.json || true
              echo "Cota diÃ¡ria do Google excedida (HTTP 429) â€” amanhÃ£ tenta os novos."
              exit 0
            fi
            echo "Google Indexing $slug -> HTTP $code"
            count=$((count+1))
            [ "$count" -ge 200 ] && { echo "Limite de 200 URLs atingido."; exit 0; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test worker localmente
        run: node worker/test-worker.mjs

      - name: Deploy no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            TRAVELPAYOUTS_MARKER
            INDEXNOW_KEY
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
