name: Atualizar blog (gera, publica e deploys)

on:
  schedule:
    # 03h UTC = meia-noite no horario de Brasilia
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      content:
        description: "Gerar e publicar conteudo (deploy so do worker nao gera posts)"
        type: boolean
        default: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar artigos do dia
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          curl -sS -X POST "${{ vars.API_URL }}/generate/daily?publish=true" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code}\n"

      - name: Publicar todos os posts agendados
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          # Render free dorme em inatividade e derruba a 1a conexao (curl 56) no cold start.
          retry_curl() { curl -sS --retry 6 --retry-delay 15 --retry-all-errors "$@"; }
          ids=$(retry_curl "${{ vars.API_URL }}/posts?status=scheduled&limit=50" | jq -r '.[].id')
          if [ -z "$ids" ]; then echo "Nenhum post agendado."; exit 0; fi
          for id in $ids; do
            code=$(retry_curl -o /dev/null -w "%{http_code}" -X POST "${{ vars.API_URL }}/posts/$id/publish" -H "Authorization: Bearer ${{ secrets.ADMIN_KEY }}" || true)
            echo "Post $id -> HTTP $code"
          done

      - name: Notificar IndexNow (indexação em minutos)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.content }}
        run: |
          host="blog-turismo-api.lucasemmanuel2005.workers.dev"
          key="${{ secrets.INDEXNOW_KEY }}"
          body=$(jq -nc --arg h "$host" --arg k "$key" '{host:$h,key:$k,keyLocation:("https://" + $h + "/" + $k + ".txt"),urlList:["https://" + $h + "/sitemap.xml"]}')
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json" -d "$body" || true)
          echo "IndexNow -> HTTP $code"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test worker localmente
        run: node worker/test-worker.mjs

      - name: Deploy no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          secrets: |
            TRAVELPAYOUTS_MARKER
            INDEXNOW_KEY
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}